<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Aggie Dash</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>

    /* ============================================================
       THEME — ALL visual settings live here.
       Dark  = [data-theme="dark"]   maroon background
       Light = [data-theme="light"]  white background
       Change colors ONLY inside these blocks.
    ============================================================ */

    /* Shared values — same in both modes */
    :root {
        --color-maroon:     #500000;
        --color-maroon-home: rgba(80, 0, 0, 0.7);
        --color-away:       rgba(200, 200, 200, 0.3);
        --color-win:        #2e9e4f;
        --color-loss:       #d63031;
        --color-live:       #e53e3e;
        --radius-card:      16px;
        --radius-btn:       12px;
        --logo-size:        62px;
        --font-display:     'Black Han Sans', sans-serif;
        --font-body:        'Nunito', sans-serif;
    }

    /* DARK MODE */
    [data-theme="dark"] {
        --color-bg:              #3a0000;
        --color-bg-glow1:        rgba(100,0,0,0.45);
        --color-bg-glow2:        rgba(80,0,0,0.25);
        --color-text:            #ffffff;
        --color-text-sub:        rgba(255,255,255,0.35);
        --color-title:           #ff7070;
        --color-card-bg:         #ffffff;
        --color-card-text:       #500000;
        --color-card-record:     #888888;
        --color-tabs-bg:         rgba(0,0,0,0.35);
        --color-tab-inactive:    rgba(255,255,255,0.45);
        --color-tab-active-bg:   #500000;
        --color-tab-active-txt:  #ffffff;
        --color-section-title:   rgba(255,255,255,0.65);
        --color-sched-bg:        rgba(255,255,255,0.05);
        --color-sched-border:    rgba(255,255,255,0.1);
        --color-sched-divider:   rgba(255,255,255,0.07);
        --color-sched-date:      rgba(255,255,255,0.6);
        --color-sched-opp:       rgba(255,255,255,0.9);
        --color-sched-rank:      rgba(255,255,255,0.55);
        --color-sched-upcoming:  rgba(255,255,255,0.35);
        --color-sched-next-bg:   rgba(80,0,0,0.4);

        --color-btn-bg:          rgba(255,255,255,0.09);
        --color-btn-txt:         #ffffff;
        --color-btn-border:      rgba(255,255,255,0.15);
        --color-btn-action-bg:   #500000;
        --color-btn-action-txt:  #ffffff;
        --color-stop-bg:         rgba(220,48,48,0.18);
        --color-stop-txt:        #ff8080;
        --color-stop-border:     rgba(220,48,48,0.3);
        --color-toggle-bg:       rgba(255,255,255,0.1);
        --color-toggle-txt:      rgba(255,255,255,0.8);
        --color-loading:         rgba(255,255,255,0.4);
        --shadow-card:           0 8px 32px rgba(0,0,0,0.5);
    }

    /* LIGHT MODE */
    [data-theme="light"] {
        --color-bg:              #f2f2f2;
        --color-bg-glow1:        rgba(80,0,0,0.05);
        --color-bg-glow2:        rgba(80,0,0,0.03);
        --color-text:            #1a1a1a;
        --color-text-sub:        rgba(0,0,0,0.4);
        --color-title:           #500000;
        --color-card-bg:         #ffffff;
        --color-card-text:       #500000;
        --color-card-record:     #888888;
        --color-tabs-bg:         rgba(0,0,0,0.07);
        --color-tab-inactive:    rgba(0,0,0,0.4);
        --color-tab-active-bg:   #500000;
        --color-tab-active-txt:  #ffffff;
        --color-section-title:   #500000;
        --color-sched-bg:        #ffffff;
        --color-sched-border:    rgba(0,0,0,0.1);
        --color-sched-divider:   rgba(0,0,0,0.07);
        --color-sched-date:      #500000;
        --color-sched-opp:       #1a1a1a;
        --color-sched-rank:      #6b0000;
        --color-sched-upcoming:  rgba(0,0,0,0.32);
        --color-sched-next-bg:   rgba(80,0,0,0.06);

        --color-btn-bg:          rgba(80,0,0,0.07);
        --color-btn-txt:         #500000;
        --color-btn-border:      rgba(80,0,0,0.15);
        --color-btn-action-bg:   #500000;
        --color-btn-action-txt:  #ffffff;
        --color-stop-bg:         rgba(200,0,0,0.08);
        --color-stop-txt:        #c00;
        --color-stop-border:     rgba(200,0,0,0.2);
        --color-toggle-bg:       rgba(80,0,0,0.08);
        --color-toggle-txt:      #500000;
        --color-loading:         rgba(0,0,0,0.32);
        --shadow-card:           0 4px 20px rgba(0,0,0,0.1);
    }

    /* ============================================================
       BASE
    ============================================================ */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        background-color: var(--color-bg);
        background-image:
            radial-gradient(ellipse at 20% 0%,   var(--color-bg-glow1) 0%, transparent 60%),
            radial-gradient(ellipse at 80% 100%, var(--color-bg-glow2) 0%, transparent 60%);
        color: var(--color-text);
        font-family: var(--font-body);
        margin: 0; padding: 16px; min-height: 100vh;
        transition: background-color 0.25s, color 0.25s;
    }
    .container { max-width: 1280px; margin: auto; }

    /* ============================================================
       HEADER
    ============================================================ */
    header { text-align: center; padding: 10px 0 16px; position: relative; }
    header h1 {
        font-family: var(--font-display);
        font-size: clamp(1.6rem, 6vw, 2.4rem);
        margin: 0; letter-spacing: 3px;
        color: var(--color-title);
    }

    /* Sun/Moon SVG button — top-right, circular */
    .mode-toggle {
        position: absolute; top: 10px; right: 0;
        background: var(--color-toggle-bg);
        color: var(--color-toggle-txt);
        border: 1px solid var(--color-btn-border);
        border-radius: 50%; width: 34px; height: 34px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; padding: 0; transition: all 0.2s;
    }
    .mode-toggle:hover { opacity: 0.75; transform: scale(1.1); }
    .mode-toggle svg { width: 16px; height: 16px; display: block; }

    /* ============================================================
       CONTROLS ROW (Sports Tabs Only)
    ============================================================ */
    .controls-row {
        display: flex; gap: 8px; margin-bottom: 12px; align-items: center;
        flex-wrap: wrap;
    }

    /* ============================================================
       SPORT TABS
    ============================================================ */
    .tabs {
        display: flex; gap: 6px; margin-bottom: 14px;
        background: var(--color-tabs-bg);
        border-radius: var(--radius-card); padding: 5px; flex: 1;
    }
    .tab-btn {
        flex: 1; padding: 10px 4px; cursor: pointer;
        background: transparent; border: 1px solid transparent;
        border-radius: 10px; color: var(--color-tab-inactive);
        font-weight: 900; font-family: var(--font-body);
        font-size: clamp(0.68rem, 2.8vw, 0.88rem); transition: all 0.2s;
    }
    .tab-btn:hover  { opacity: 0.75; }
    .tab-btn.active { background: var(--color-tab-active-bg); color: var(--color-tab-active-txt); }

    /* ============================================================
       GAME CARD
    ============================================================ */
    .game-card {
        background: var(--color-card-bg);
        border-radius: var(--radius-card);
        padding: 18px 12px; margin-bottom: 14px;
        min-height: 130px; box-shadow: var(--shadow-card);
        display: grid; grid-template-columns: 1fr auto 1fr;
        align-items: start;
        gap: 8px; transition: background 0.25s;
    }
    .game-card .gc-center { align-self: center; }
    .game-card.empty {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 8px; text-align: center;
    }
    .gc-empty-label  { font-family: var(--font-display); font-size: 1.3rem; color: var(--color-card-text); letter-spacing: 2px; }
    .gc-empty-record { color: var(--color-card-record); font-size: 0.82rem; font-weight: 700; }

    .gc-team {
        display: grid;
        grid-template-rows: var(--logo-size) 1.8em 1.2em;
        align-items: center;
        justify-items: center;
        text-align: center;
        gap: 4px;
    }
    .gc-logo {
        width: var(--logo-size); height: var(--logo-size);
        object-fit: contain; display: block;
    }
    .gc-logo-placeholder {
        width: var(--logo-size); height: var(--logo-size);
        background: #f0eaea; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.62rem; font-weight: 900; color: #aaa; letter-spacing: 0.5px;
    }
    .gc-name-row {
        display: flex; align-items: center; justify-content: center;
        gap: 4px; flex-wrap: wrap; width: 100%;
        font-size: clamp(0.6rem, 2.2vw, 0.78rem); font-weight: 900;
        color: var(--color-card-text); line-height: 1.2;
    }
    .gc-rank-badge {
        background: var(--color-maroon); color: #fff;
        font-size: 0.58rem; font-weight: 900;
        padding: 1px 5px; border-radius: 4px; white-space: nowrap;
        flex-shrink: 0;
    }
    .gc-record {
        font-size: 0.65rem; font-weight: 700;
        color: var(--color-card-record);
        display: flex; align-items: center; justify-content: center;
        width: 100%;
    }

    .gc-center  { text-align: center; padding: 0 4px; }
    .gc-label   { font-family: var(--font-display); font-size: clamp(1.1rem,4.5vw,1.5rem); color: var(--color-card-text); letter-spacing: 3px; }
    .gc-status  { font-size: clamp(0.58rem,2vw,0.7rem); font-weight: 900; color: var(--color-live); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
    .gc-score   { font-family: var(--font-display); font-size: clamp(1.8rem,7vw,2.8rem); color: var(--color-maroon); line-height: 1; }
    .gc-date    { font-size: 0.68rem; font-weight: 700; color: #555; margin-top: 4px; }
    .gc-time    { font-size: 0.65rem; color: #888; }
    .gc-network { font-size: 0.6rem;  color: #aaa; margin-top: 2px; }

    /* Live stats row */
    .gc-stats {
        font-size: 0.6rem; color: var(--color-text-sub);
        display: flex; gap: 8px; justify-content: center;
        flex-wrap: wrap; margin-top: 6px;
    }
    .gc-stat-item { display: flex; gap: 2px; }
    .gc-stat-label { font-weight: 700; }

    /* ============================================================
       SCHEDULE GRID — SQUARE CARDS, PROPER SIZING
    ============================================================ */
    .section-title {
        font-family: var(--font-display); font-size: 0.85rem;
        letter-spacing: 2px; text-transform: uppercase;
        color: var(--color-section-title); margin: 0 0 10px 4px;
    }

    .sched-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
    }

    @media (min-width: 768px) {
        .sched-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }
    }

    @media (min-width: 1024px) {
        .sched-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
    }

    .sched-card {
        position: relative;
        background: rgba(74, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 12px;
        cursor: pointer;
        transition: all 0.25s ease;
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        font-family: var(--font-body);
    }

    /* Home game (maroon) */
    .sched-card.home {
        background: linear-gradient(135deg, rgba(80, 0, 0, 0.8) 0%, rgba(60, 0, 0, 0.6) 100%);
        border-color: rgba(255, 100, 100, 0.4);
    }

    /* Away game (light gray semi-transparent) */
    .sched-card.away {
        background: linear-gradient(135deg, rgba(200, 200, 200, 0.35) 0%, rgba(180, 180, 180, 0.25) 100%);
        border-color: rgba(200, 200, 200, 0.25);
    }

    .sched-card:hover {
        transform: translateY(-4px);
        border-color: rgba(255, 255, 255, 0.4);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .sched-card:active {
        transform: translateY(-2px);
    }

    /* Card header: Date/Time/Countdown */
    .sched-card-header {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 6px;
    }

    .sched-card-date {
        font-weight: 700;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.8);
        letter-spacing: 0.5px;
        text-transform: uppercase;
        line-height: 1.2;
    }

    /* Card center: Logo */
    .sched-card-logo-container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 1;
        margin: 8px 0;
    }

    .sched-card-logo {
        width: 80px;
        height: 80px;
        object-fit: contain;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    .sched-card-logo-placeholder {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.65rem;
        font-weight: 900;
        color: rgba(255, 255, 255, 0.3);
    }

    /* Card footer: Opponent and Result */
    .sched-card-footer {
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-align: center;
    }

    .sched-card-opp {
        font-weight: 900;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.95);
        line-height: 1.3;
        letter-spacing: 0.2px;
    }

    .sched-card-result {
        font-size: 0.72rem;
        font-weight: 900;
        color: rgba(255, 255, 255, 0.45);
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }

    .sched-card.won .sched-card-result {
        color: var(--color-win);
    }

    .sched-card.lost .sched-card-result {
        color: var(--color-loss);
    }

    .sched-card.live .sched-card-result {
        color: var(--color-live);
    }

    .sched-card.next-up {
        border-color: rgba(255, 255, 255, 0.55);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
    }
    .sched-card-next-badge {
        position: absolute; top: 8px; right: 8px;
        background: #ffffff; color: var(--color-maroon);
        font-size: 0.58rem; font-weight: 900;
        padding: 2px 6px; border-radius: 6px;
        letter-spacing: 0.5px;
    }

    /* ============================================================
       QUICK STATS BUTTONS (REMOVED)
    ============================================================ */
    .quick-stats {
        display: none;
    }

    /* ============================================================
       MODAL
    ============================================================ */
    .modal-overlay {
        display: none;
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7); z-index: 1000;
        align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
        background: var(--color-maroon);
        border-radius: var(--radius-card);
        padding: 20px;
        width: min(440px, 90vw); max-height: 85vh;
        overflow-y: auto;
        position: relative;
        box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    .modal-close {
        position: absolute; top: 12px; right: 12px;
        background: none; border: none;
        font-size: 1.5rem; cursor: pointer;
        color: #ffffff;
    }

    /* Matchup header: away logo — @ — home logo */
    .modal-matchup-header {
        display: grid; grid-template-columns: 1fr auto 1fr;
        align-items: center; gap: 8px;
        margin-bottom: 14px;
    }
    .mm-team { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
    .mm-team img, .mm-team .gc-logo-placeholder { width: 48px; height: 48px; }
    .mm-name { font-weight: 900; font-size: 0.8rem; color: #ffffff; }
    .mm-record { font-size: 0.68rem; color: rgba(255,255,255,0.65); font-weight: 700; }
    .mm-vs { font-family: var(--font-display); font-size: 1rem; color: rgba(255,255,255,0.65); }
    .modal .section-title { color: rgba(255,255,255,0.75); }
    .modal .loading { color: rgba(255,255,255,0.55); }

    /* Stat comparison */
    .modal-compare { margin-top: 10px; }
    .cmp-header {
        display: flex; justify-content: space-between;
        font-size: 0.68rem; font-weight: 900; text-transform: uppercase;
        letter-spacing: 0.5px; color: rgba(255,255,255,0.65);
        margin-bottom: 6px; padding: 0 2px;
    }
    .cmp-row {
        display: grid; grid-template-columns: 44px 1fr 44px;
        align-items: center; gap: 8px;
        padding: 7px 0;
        border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .cmp-val {
        font-weight: 700; font-size: 0.8rem;
        color: #ffffff; text-align: center;
    }
    .cmp-val.lead { color: #8ce99a; font-weight: 900; }
    .cmp-mid { display: flex; flex-direction: column; gap: 3px; }
    .cmp-label {
        font-size: 0.62rem; font-weight: 700; text-align: center;
        color: rgba(255,255,255,0.65); text-transform: uppercase; letter-spacing: 0.3px;
    }
    .cmp-bars { display: flex; gap: 2px; }
    .cmp-bar {
        flex: 1; height: 5px; border-radius: 3px;
        background: rgba(255,255,255,0.15); overflow: hidden;
        display: flex;
    }
    .cmp-bar.left { justify-content: flex-end; }
    .cmp-bar span { display: block; height: 100%; border-radius: 3px; }

    /* Leaders */
    .leader-row {
        display: grid; grid-template-columns: 1fr auto 1fr;
        align-items: center; gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .leader-side { text-align: center; }
    .leader-name { font-size: 0.72rem; font-weight: 700; color: #ffffff; }
    .leader-stat { font-size: 0.68rem; color: rgba(255,255,255,0.65); font-weight: 700; }
    .leader-cat {
        font-size: 0.62rem; font-weight: 900; text-transform: uppercase;
        color: rgba(255,255,255,0.65); letter-spacing: 0.3px; text-align: center;
    }

    /* ============================================================
       SOUNDS
    ============================================================ */
    .sounds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .audio-btn {
        padding: 14px 10px; border-radius: var(--radius-btn);
        font-weight: 900; font-family: var(--font-body);
        font-size: clamp(0.76rem, 2.8vw, 0.9rem); cursor: pointer;
        background: var(--color-btn-bg); color: var(--color-btn-txt);
        border: 1px solid var(--color-btn-border); transition: all 0.15s;
    }
    .audio-btn:hover  { opacity: 0.8; }
    .audio-btn:active { transform: scale(0.96); }
    .audio-btn.action { background: var(--color-btn-action-bg); color: var(--color-btn-action-txt); border-color: var(--color-btn-action-bg); }
    .audio-btn.stop-btn { background: var(--color-stop-bg); color: var(--color-stop-txt); border-color: var(--color-stop-border); }
    .audio-btn.playing {
        background: var(--color-win); color: #fff; border-color: var(--color-win);
        box-shadow: 0 0 0 2px rgba(46,158,79,0.3);
    }
    .audio-btn.playing::after { content: ' ♪'; }
    .audio-error {
        display: none;
        background: var(--color-stop-bg); color: var(--color-stop-txt);
        border: 1px solid var(--color-stop-border);
        border-radius: var(--radius-btn);
        padding: 10px 12px; margin-bottom: 10px;
        font-size: 0.78rem; font-weight: 700;
    }

    /* ============================================================
       MISC
    ============================================================ */
    @keyframes pulse  { 0%,100%{opacity:.3} 50%{opacity:.8} }
    @keyframes fadein { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }
    .loading { animation: pulse 1.6s infinite; color: var(--color-loading); text-align: center; padding: 12px; font-size: 0.85rem; }
    .fadein  { animation: fadein 0.3s ease; }

    </style>
</head>
<body>
<div class="container">

    <header>
        <h1>AGGIE DASH</h1>
        <button class="mode-toggle" onclick="toggleMode()" id="mode-btn" title="Toggle light/dark">
            <svg id="mode-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <g id="icon-sun">
                    <circle cx="12" cy="12" r="4"/>
                    <line x1="12" y1="2"  x2="12" y2="5"/>
                    <line x1="12" y1="19" x2="12" y2="22"/>
                    <line x1="2"  y1="12" x2="5"  y2="12"/>
                    <line x1="19" y1="12" x2="22" y2="12"/>
                    <line x1="4.22"  y1="4.22"  x2="6.34"  y2="6.34"/>
                    <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
                    <line x1="4.22"  y1="19.78" x2="6.34"  y2="17.66"/>
                    <line x1="17.66" y1="6.34"  x2="19.78" y2="4.22"/>
                </g>
                <g id="icon-moon" style="display:none">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </g>
            </svg>
        </button>
    </header>

    <!-- Sport Tabs Only -->
    <div class="controls-row">
        <div class="tabs" style="width: 100%;">
            <button id="btn-football"   class="tab-btn active" onclick="setSport('football')">Football</button>
            <button id="btn-basketball" class="tab-btn"        onclick="setSport('basketball-men')">Basketball</button>
            <button id="btn-baseball"   class="tab-btn"        onclick="setSport('baseball')">Baseball</button>
        </div>
    </div>

    <!-- Main card: next game preview OR live score -->
    <div id="live-score" class="game-card empty fadein">
        <div style="font-weight:700;color:#888;font-size:0.9rem">Loading...</div>
    </div>

    <!-- Schedule Grid (All Games, 3-4 Columns, Square) -->
    <div class="section-title">Schedule</div>
    <div id="sched-grid" class="sched-grid"><div class="loading" style="grid-column:1/-1">Loading schedule...</div></div>

    <div class="section-title">Sounds</div>
    <div id="audio-error" class="audio-error"></div>
    <div class="sounds-grid">
        <button class="audio-btn"        onclick="play('war_hymn.mp3', this)">War Hymn</button>
        <button class="audio-btn"        onclick="play('spirit.mp3', this)">Spirit of Aggieland</button>
        <button class="audio-btn action" onclick="play('touchdown.mp3', this)">Touchdown</button>
        <button class="audio-btn action" onclick="play('homerun.mp3', this)">Rattlin' Bog</button>
        <button class="audio-btn"        onclick="play('Rifleman.mp3', this)">The Rifleman</button>
        <button class="audio-btn"        onclick="play('Turbulence.mp3', this)">Turbulence</button>
        <button class="audio-btn stop-btn" id="stop-btn" onclick="stopAudio()" style="grid-column:1/-1;display:none;">Stop Audio</button>
    </div>

</div>

<!-- Modal Overlay -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div id="modal-body"></div>
    </div>
</div>

<script>
/* ================================================================
   CONFIGURATION
================================================================ */
const sportConfig = {
    'football': {
        espnSport:  'football',
        espnLeague: 'college-football',
        teamId:     '245',
        season:     2026,
    },
    'basketball-men': {
        espnSport:  'basketball',
        espnLeague: 'mens-college-basketball',
        teamId:     '245',
    },
    'baseball': {
        espnSport:  'baseball',
        espnLeague: 'college-baseball',
        teamId:     '123',
    },
};

/* ================================================================
   APP STATE
================================================================ */
let currentSport = 'football';
let allEvents = [];
let currentEvent = null;
let modalEvent = null;
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports';
const TZ   = 'America/Chicago';

/* ================================================================
   LIGHT / DARK MODE TOGGLE
================================================================ */
function setModeIcon(theme) {
    document.getElementById('icon-sun').style.display  = theme === 'dark'  ? '' : 'none';
    document.getElementById('icon-moon').style.display = theme === 'light' ? '' : 'none';
}
function toggleMode() {
    const html   = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    const next   = isDark ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    setModeIcon(next);
    localStorage.setItem('aggie-dash-theme', next);
}
(function initTheme() {
    const saved = localStorage.getItem('aggie-dash-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    setModeIcon(saved);
})();

/* ================================================================
   UTILITY HELPERS
================================================================ */
function toCT(date) {
    return date.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', timeZone: TZ });
}

function toCTDate(date, opts) {
    return date.toLocaleDateString('en-US', { ...opts, timeZone: TZ });
}

function getScore(c) {
    const v = c?.score?.value ?? c?.score;
    return (v !== undefined && v !== null) ? parseFloat(v) : null;
}

function getRank(c) {
    const r = c?.curatedRank?.current || c?.rank;
    return (r && r < 99) ? r : null;
}

function getRecord(c) {
    if (!c) return '';
    const recs = c.records || [];
    const r = recs.find(x => x.type === 'total' || x.name === 'overall' || x.abbreviation === 'Game');
    return r?.summary || recs[0]?.summary || '';
}

function getLogo(team) {
    if (!team) return '';
    if (team.logos?.length) {
        const big = team.logos.find(l => l.width >= 200) || team.logos[0];
        return (big.href || '').replace('http://', 'https://');
    }
    if (team.logo) return team.logo.replace('http://', 'https://');
    if (team.id)   return `https://a.espncdn.com/i/teamlogos/colleges/500/${team.id}.png`;
    return '';
}

function logoImg(team) {
    const src = getLogo(team);
    if (!src) return `<div class="gc-logo-placeholder">TBD</div>`;
    return `<img class="gc-logo" src="${src}" onerror="this.outerHTML='<div class=\\'gc-logo-placeholder\\'>TBD</div>'" alt="">`;
}

function schedLogoImg(team) {
    const src = getLogo(team);
    if (!src) return `<div class="sched-card-logo-placeholder">TBD</div>`;
    return `<img class="sched-card-logo" src="${src}" onerror="this.outerHTML='<div class=\\'sched-card-logo-placeholder\\'>TBD</div>'" alt="">`;
}

function rankBadge(rank) {
    return rank ? `<span class="gc-rank-badge">#${rank}</span>` : '';
}

/* ================================================================
   FETCH
================================================================ */
async function fetchLiveScore(cfg) {
    const findAggies = events =>
        (events || []).find(e =>
            e.competitions?.[0]?.competitors?.some(c => c.team?.id === cfg.teamId)
        ) || null;

    const local   = new Date(new Date().toLocaleString('en-US', {timeZone: 'America/Chicago'}));
    const ymd     = `${local.getFullYear()}${String(local.getMonth()+1).padStart(2,'0')}${String(local.getDate()).padStart(2,'0')}`;
    const todayCT = toCTDate(local, { year:'numeric', month:'numeric', day:'numeric' });
    const base    = `${ESPN}/${cfg.espnSport}/${cfg.espnLeague}/scoreboard`;

    // Date-scoped queries only — an un-scoped query can return "this week's"
    // game from ESPN's default context even when it's days/weeks away, which
    // would wrongly render as a live/today card.
    const urls = [
        `${base}?dates=${ymd}`,
        `${base}?dates=${ymd}&groups=50&limit=300`,
        `${base}?dates=${ymd}&limit=300`,
    ];

    for (const url of urls) {
        try {
            const r = await fetch(url);
            if (!r.ok) continue;
            const d = await r.json();
            const hit = findAggies(d.events);
            if (!hit) continue;

            const st = hit.competitions?.[0]?.status?.type?.state;
            const gameCT = toCTDate(new Date(hit.date), { year:'numeric', month:'numeric', day:'numeric' });
            // Only surface it as "live" if it's in progress, finished, or actually today.
            if (st === 'in' || st === 'post' || gameCT === todayCT) return hit;
        } catch(e) { }
    }
    return null;
}

async function fetchSchedule(cfg) {
    const year = cfg.season || new Date().getFullYear();
    const base = `${ESPN}/${cfg.espnSport}/${cfg.espnLeague}/teams/${cfg.teamId}/schedule`;

    // ESPN's team-schedule endpoint can lag behind the live scoreboard for a
    // season that hasn't kicked off yet, so try a few query shapes in order.
    const urls = [
        `${base}?season=${year}`,
        `${base}?season=${year}&seasontype=2`,
        base, // no season param — ESPN's current default context
    ];

    for (const url of urls) {
        try {
            const res = await fetch(url);
            if (!res.ok) continue;
            const data = await res.json();
            if (data.events && data.events.length) return data.events;
        } catch(e) {
            console.error('Schedule fetch error:', url, e);
        }
    }
    return [];
}

/* ================================================================
   RENDER — LIVE / TODAY SCORE CARD
================================================================ */
function renderLiveScore(event, cfg = {}) {
    currentEvent = event;
    const el   = document.getElementById('live-score');
    const comp = event.competitions[0];
    const home = comp.competitors.find(c => c.homeAway === 'home');
    const away = comp.competitors.find(c => c.homeAway === 'away');
    const st   = comp.status?.type;

    let statusText;
    if (st?.completed) {
        statusText = 'FINAL' + (st.shortDetail?.includes('OT') ? '/OT' : '');
    } else if (st?.state === 'in') {
        const clock  = comp.status?.displayClock || '';
        const period = comp.status?.period;
        let periodLabel = '';
        if (period) {
            if (cfg.espnLeague === 'college-football') {
                const qLabels = ['Q1','Q2','Q3','Q4'];
                periodLabel = qLabels[period - 1] || `OT${period > 4 ? period - 4 : ''}`;
            } else if (cfg.espnLeague === 'mens-college-basketball') {
                const hLabels = ['H1','H2'];
                periodLabel = hLabels[period - 1] || `OT${period > 2 ? period - 2 : ''}`;
            } else if (cfg.espnLeague === 'college-baseball') {
                const ordinals = ['1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th','11th','12th','13th','14th','15th'];
                const inningLabel = ordinals[period - 1] || `${period}th`;
                const detail = comp.status?.shortDetail || '';
                const half = /top/i.test(detail) ? '▲' : /bot/i.test(detail) ? '▽' : '';
                periodLabel = `${half} ${inningLabel}`.trim();
            }
        }
        statusText = `LIVE  ${clock}${periodLabel ? '  ' + periodLabel : ''}`;
    } else {
        const gameTime = event.date ? toCT(new Date(event.date)) + ' CDT' : 'UPCOMING';
        statusText = gameTime;
    }

    const network = comp.broadcasts?.[0]?.names?.[0] || comp.geoBroadcasts?.[0]?.media?.shortName || '';

    el.className = 'game-card fadein';
    el.innerHTML = `
        <div class="gc-team">
            ${logoImg(away.team)}
            <div class="gc-name-row">${rankBadge(getRank(away))}${away.team.shortDisplayName}</div>
            <div class="gc-record">${getRecord(away)}</div>
        </div>
        <div class="gc-center">
            <div class="gc-status">${statusText}</div>
            <div class="gc-score">${away.score ?? '–'} – ${home.score ?? '–'}</div>
            ${network ? `<div class="gc-network">${network}</div>` : ''}
        </div>
        <div class="gc-team">
            ${logoImg(home.team)}
            <div class="gc-name-row">${rankBadge(getRank(home))}${home.team.shortDisplayName}</div>
            <div class="gc-record">${getRecord(home)}</div>
        </div>`;
}

/* ================================================================
   RENDER — NEXT GAME CARD (or OFFSEASON)
================================================================ */
function renderNextGame(events, cfg) {
    const el  = document.getElementById('live-score');
    const now = Date.now();

    let w = 0, l = 0;
    events.forEach(e => {
        const comp = e.competitions?.[0];
        const us   = comp?.competitors?.find(c => c.team?.id === cfg.teamId);
        const them = comp?.competitors?.find(c => c.team?.id !== cfg.teamId);
        if (!comp?.status?.type?.completed || !us || !them) return;
        const uS = getScore(us), tS = getScore(them);
        if (uS !== null && tS !== null) uS > tS ? w++ : l++;
    });
    const recStr = w + l > 0 ? `${w}-${l}` : '';

    const next = events.find(e =>
        new Date(e.date) > now && !e.competitions?.[0]?.status?.type?.completed
    );

    if (!next) {
        currentEvent = null;
        el.className = 'game-card empty fadein';
        el.innerHTML = `
            <div class="gc-empty-label">OFFSEASON</div>
            ${recStr ? `<div class="gc-empty-record">Final Record: ${recStr}</div>` : ''}`;
        return;
    }

    currentEvent = next;
    const comp    = next.competitions[0];
    const aggies  = comp.competitors.find(c => c.team?.id === cfg.teamId);
    const opp     = comp.competitors.find(c => c.team?.id !== cfg.teamId);
    const isHome  = aggies?.homeAway === 'home';
    const gd      = new Date(next.date);
    const dateStr = toCTDate(gd, { weekday:'short', month:'short', day:'numeric' });
    const timeStr = toCT(gd) + ' CDT';
    const network = comp.broadcasts?.[0]?.names?.[0] || comp.geoBroadcasts?.[0]?.media?.shortName || '';
    const ourRec  = getRecord(aggies) || recStr;
    const oppRec  = getRecord(opp);

    el.className = 'game-card fadein';
    el.innerHTML = `
        <div class="gc-team">
            ${logoImg(aggies?.team)}
            <div class="gc-name-row">${rankBadge(getRank(aggies))}Texas A&M</div>
            <div class="gc-record">${ourRec}</div>
        </div>
        <div class="gc-center">
            <div class="gc-label">${isHome ? 'VS' : 'AT'}</div>
            <div class="gc-date">${dateStr}</div>
            <div class="gc-time">${timeStr}</div>
            ${network ? `<div class="gc-network">${network}</div>` : ''}
        </div>
        <div class="gc-team">
            ${logoImg(opp?.team)}
            <div class="gc-name-row">${rankBadge(getRank(opp))}${opp?.team?.shortDisplayName || 'TBD'}</div>
            <div class="gc-record">${oppRec}</div>
        </div>`;
}

/* ================================================================
   RENDER — SCHEDULE GRID (ALL GAMES, SQUARE CARDS)
================================================================ */
function renderScheduleGrid(events, cfg) {
    const el = document.getElementById('sched-grid');
    if (!events.length) { el.innerHTML = '<div class="loading" style="grid-column:1/-1">No schedule found.</div>'; return; }

    const now = Date.now();
    const nextIdx = events.findIndex(e =>
        new Date(e.date).getTime() > now && !e.competitions?.[0]?.status?.type?.completed
    );

    let html = '';
    events.forEach((event, idx) => {
        const comp     = event.competitions?.[0];
        const aggies   = comp?.competitors?.find(c => c.team?.id === cfg.teamId);
        const opp      = comp?.competitors?.find(c => c.team?.id !== cfg.teamId);
        const isHome   = aggies?.homeAway === 'home';
        const homeAwayClass = isHome ? 'home' : 'away';
        const nextClass = idx === nextIdx ? 'next-up' : '';
        const homeAwayLabel = isHome ? 'vs' : '@';
        const oppName  = opp?.team?.shortDisplayName || opp?.team?.displayName || 'TBD';
        const gd       = new Date(event.date);
        const dateStr  = toCTDate(gd, { month:'short', day:'numeric' }).toUpperCase();
        const timeStr  = toCT(gd);
        const done     = comp?.status?.type?.completed;
        const inProg   = comp?.status?.type?.state === 'in';

        let resultClass = '';
        let result = '';
        if (done) {
            const us = getScore(aggies), them = getScore(opp);
            const won = us !== null && them !== null && us > them;
            resultClass = won ? 'won' : 'lost';
            result = `${won ? 'W' : 'L'} ${us ?? '?'}-${them ?? '?'}`;
        } else if (inProg) {
            const us = getScore(aggies) ?? '–', them = getScore(opp) ?? '–';
            resultClass = 'live';
            result = `LIVE ${us}-${them}`;
        } else {
            result = timeStr;
        }

        const headerHtml = `<span class="sched-card-date">${dateStr}</span>`;

        html += `
            <button class="sched-card ${homeAwayClass} ${resultClass} ${nextClass}" onclick="openGameModal(${idx})">
                ${idx === nextIdx ? '<span class="sched-card-next-badge">NEXT</span>' : ''}
                <div class="sched-card-header">
                    ${headerHtml}
                </div>
                <div class="sched-card-logo-container">
                    ${schedLogoImg(opp?.team)}
                </div>
                <div class="sched-card-footer">
                    <div class="sched-card-opp">${homeAwayLabel} ${oppName}</div>
                    <div class="sched-card-result">${result}</div>
                </div>
            </button>`;
    });
    el.innerHTML = html;
}

/* ================================================================
   STAT HELPERS
================================================================ */
function parseNum(v) {
    if (v === null || v === undefined) return 0;
    const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
    return isNaN(n) ? 0 : n;
}

// Find a category (e.g. "passing", "rushing", "scoring") inside a team
// statistics response, regardless of exactly how it's nested.
function findCategory(data, nameRegex) {
    const cats = data?.results?.stats?.categories || data?.splits?.categories || data?.categories || [];
    return cats.find(c => nameRegex.test(c.name || c.displayName || '')) || null;
}
function findStat(category, nameRegex) {
    if (!category) return null;
    const stats = category.stats || [];
    return stats.find(s => nameRegex.test(s.name || '') || nameRegex.test(s.displayName || '') || nameRegex.test(s.shortDisplayName || '')) || null;
}

async function fetchJSON(url) {
    try {
        const r = await fetch(url);
        if (!r.ok) return null;
        return await r.json();
    } catch (e) { return null; }
}

// Build one comparison row: away value on the left, home value on the right,
// with a proportional mini-bar (colored per team) and the leading side
// bolded — same idea as ESPN's matchup/team-stats comparison view.
function statCompareRow(label, leftVal, rightVal, leftColor, rightColor, leftDisplay, rightDisplay) {
    const l = parseNum(leftVal), r = parseNum(rightVal);
    const max = Math.max(l, r, 1);
    const lPct = Math.round((l / max) * 100);
    const rPct = Math.round((r / max) * 100);
    return `
        <div class="cmp-row">
            <div class="cmp-val ${l > r ? 'lead' : ''}">${leftDisplay ?? leftVal}</div>
            <div class="cmp-mid">
                <div class="cmp-label">${label}</div>
                <div class="cmp-bars">
                    <div class="cmp-bar left"><span style="width:${lPct}%;background:${leftColor}"></span></div>
                    <div class="cmp-bar right"><span style="width:${rPct}%;background:${rightColor}"></span></div>
                </div>
            </div>
            <div class="cmp-val ${r > l ? 'lead' : ''}">${rightDisplay ?? rightVal}</div>
        </div>`;
}

// Pull actual game stats (final or in-progress) out of the summary boxscore.
function buildBoxscoreComparison(summary, awayTeamId, homeTeamId, colors) {
    const teams = summary?.boxscore?.teams;
    if (!teams || teams.length < 2) return null;
    const awayBox = teams.find(t => t.team?.id === awayTeamId);
    const homeBox = teams.find(t => t.team?.id === homeTeamId);
    if (!awayBox?.statistics?.length || !homeBox?.statistics?.length) return null;

    let rows = '';
    awayBox.statistics.forEach(stat => {
        const homeStat = homeBox.statistics.find(s => s.name === stat.name);
        if (!homeStat) return;
        const label = stat.label || stat.displayName || stat.name;
        rows += statCompareRow(label, stat.displayValue, homeStat.displayValue, colors.away, colors.home);
    });
    return rows || null;
}

// Pull season-average stats for both teams (used pregame, before any
// boxscore data exists).
async function buildSeasonComparison(cfg, awayTeamId, homeTeamId, colors) {
    const url = id => `${ESPN}/${cfg.espnSport}/${cfg.espnLeague}/teams/${id}/statistics`;
    const [awayData, homeData] = await Promise.all([fetchJSON(url(awayTeamId)), fetchJSON(url(homeTeamId))]);
    if (!awayData || !homeData) return null;

    const wanted = [
        { label: 'Points / Game',        cat: /scoring/i,          stat: /totalPointsPerGame|pointsPerGame/i },
        { label: 'Points Allowed / Game',cat: /defensive|scoring/i,stat: /pointsAllowed|against|opponent.*points/i },
        { label: 'Total Yards / Game',   cat: /general|total|offense/i, stat: /yardsPerGame|totalYards/i },
        { label: 'Passing Yards / Game', cat: /passing/i,          stat: /yardsPerGame|passingYards/i },
        { label: 'Rushing Yards / Game', cat: /rushing/i,          stat: /yardsPerGame|rushingYards/i },
    ];

    let rows = '';
    let found = 0;
    wanted.forEach(w => {
        const aCat = findCategory(awayData, w.cat), hCat = findCategory(homeData, w.cat);
        const aStat = findStat(aCat, w.stat), hStat = findStat(hCat, w.stat);
        if (aStat && hStat) {
            found++;
            rows += statCompareRow(w.label, aStat.displayValue, hStat.displayValue, colors.away, colors.home);
        }
    });
    return found ? rows : null;
}

// Team leaders (passing/rushing/receiving) — mirrors the "Leaders" module
// ESPN shows on its game page.
function buildLeaders(summary, awayTeamId, homeTeamId) {
    const leaders = summary?.leaders;
    if (!leaders || !leaders.length) return null;
    const awayL = leaders.find(l => l.team?.id === awayTeamId);
    const homeL = leaders.find(l => l.team?.id === homeTeamId);
    if (!awayL && !homeL) return null;

    const cats = [
        { label: 'Passing',   re: /pass/i },
        { label: 'Rushing',   re: /rush/i },
        { label: 'Receiving', re: /rec/i },
    ];

    let rows = '';
    cats.forEach(c => {
        const aEntry = awayL?.leaders?.find(x => c.re.test(x.name || x.displayName || ''));
        const hEntry = homeL?.leaders?.find(x => c.re.test(x.name || x.displayName || ''));
        const aTop = aEntry?.leaders?.[0];
        const hTop = hEntry?.leaders?.[0];
        if (!aTop && !hTop) return;
        rows += `
            <div class="leader-row">
                <div class="leader-side">
                    ${aTop ? `<div class="leader-name">${aTop.athlete?.shortName || aTop.athlete?.displayName || ''}</div><div class="leader-stat">${aTop.displayValue || ''}</div>` : '<div class="leader-stat">—</div>'}
                </div>
                <div class="leader-cat">${c.label}</div>
                <div class="leader-side">
                    ${hTop ? `<div class="leader-name">${hTop.athlete?.shortName || hTop.athlete?.displayName || ''}</div><div class="leader-stat">${hTop.displayValue || ''}</div>` : '<div class="leader-stat">—</div>'}
                </div>
            </div>`;
    });
    return rows || null;
}

/* ================================================================
   MODAL SYSTEM
================================================================ */
async function openGameModal(idx) {
    const event = allEvents[idx];
    const cfg = sportConfig[currentSport];
    if (!event) return;

    modalEvent = event;
    const comp = event.competitions?.[0];
    const away = comp.competitors.find(c => c.homeAway === 'away');
    const home = comp.competitors.find(c => c.homeAway === 'home');

    // A&M's bar is always white; the opponent's bar uses their own team color.
    const awayIsAggies = away.team?.id === cfg.teamId;
    const teamBarColor = (team, isAggies) => isAggies ? '#ffffff' : `#${team?.color || '500000'}`;
    const colors = {
        away: teamBarColor(away.team, awayIsAggies),
        home: teamBarColor(home.team, !awayIsAggies),
    };

    const body = document.getElementById('modal-body');
    body.innerHTML = `
        <div class="modal-matchup-header">
            <div class="mm-team">${logoImg(away.team)}<div class="mm-name">${away.team.shortDisplayName}</div><div class="mm-record">${getRecord(away)}</div></div>
            <div class="mm-vs">@</div>
            <div class="mm-team">${logoImg(home.team)}<div class="mm-name">${home.team.shortDisplayName}</div><div class="mm-record">${getRecord(home)}</div></div>
        </div>
        <div id="modal-compare" class="modal-compare">
            <div class="loading" style="padding:16px 0;">Loading matchup stats...</div>
        </div>`;

    document.getElementById('modal-overlay').classList.add('open');

    // Fetch the deeper comparison data asynchronously so the modal opens instantly.
    const compareEl = document.getElementById('modal-compare');
    const eventId = event.id || comp.id;
    let summary = null;
    if (eventId) {
        summary = await fetchJSON(`${ESPN}/${cfg.espnSport}/${cfg.espnLeague}/summary?event=${eventId}`);
    }

    // Bail out silently if the user already closed/switched games while loading.
    if (modalEvent !== event) return;

    let compareHtml = '';

    const boxRows = summary ? buildBoxscoreComparison(summary, away.team.id, home.team.id, colors) : null;
    if (boxRows) {
        compareHtml += `<div class="section-title" style="margin-top:4px;">Game Stats</div><div class="cmp-header"><span>${away.team.shortDisplayName}</span><span>${home.team.shortDisplayName}</span></div>${boxRows}`;
    } else {
        const seasonRows = await buildSeasonComparison(cfg, away.team.id, home.team.id, colors);
        if (modalEvent !== event) return;
        if (seasonRows) {
            compareHtml += `<div class="section-title" style="margin-top:4px;">Season Averages</div><div class="cmp-header"><span>${away.team.shortDisplayName}</span><span>${home.team.shortDisplayName}</span></div>${seasonRows}`;
        }
    }

    const leaderRows = summary ? buildLeaders(summary, away.team.id, home.team.id) : null;
    if (leaderRows) {
        compareHtml += `<div class="section-title" style="margin-top:16px;">Leaders</div>${leaderRows}`;
    }

    compareEl.innerHTML = compareHtml || `<div class="loading" style="padding:16px 0;">Detailed stats aren't available for this matchup yet.</div>`;
}

function closeModal(event) {
    if (event && event.target.id !== 'modal-overlay') return;
    document.getElementById('modal-overlay').classList.remove('open');
    modalEvent = null;
}

/* ================================================================
   AUDIO PLAYBACK
================================================================ */
let currentAudio = null;
let currentBtn = null;

function play(file, btn) {
    const wasThisBtn = currentBtn === btn;
    stopAudio();
    if (wasThisBtn) return; // clicking the same button again just stops it

    // Files live at the repo root, not in a media/ subfolder.
    currentAudio = new Audio(encodeURIComponent(file));
    currentBtn = btn || null;

    currentAudio.play().then(() => {
        if (currentBtn) currentBtn.classList.add('playing');
        document.getElementById('stop-btn').style.display = 'block';
    }).catch(e => {
        console.error('Audio play error:', e);
        showAudioError(`Couldn't play "${file}". Check the file exists in the repo root and the filename matches exactly (case-sensitive).`);
        currentAudio = null;
        currentBtn = null;
    });

    currentAudio.onended = () => {
        if (currentBtn) currentBtn.classList.remove('playing');
        document.getElementById('stop-btn').style.display = 'none';
        currentAudio = null;
        currentBtn = null;
    };
}

function stopAudio() {
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
    }
    if (currentBtn) {
        currentBtn.classList.remove('playing');
        currentBtn = null;
    }
    document.getElementById('stop-btn').style.display = 'none';
}

let audioErrorTimeout = null;
function showAudioError(msg) {
    const el = document.getElementById('audio-error');
    if (!el) return;
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(audioErrorTimeout);
    audioErrorTimeout = setTimeout(() => { el.style.display = 'none'; }, 5000);
}

/* ================================================================
   MAIN LOGIC
================================================================ */
async function setSport(sport) {
    currentSport = sport;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${sport.split('-')[0]}`).classList.add('active');

    const cfg = sportConfig[sport];
    
    document.getElementById('live-score').innerHTML = '<div style="font-weight:700;color:#888;font-size:0.9rem">Loading...</div>';
    document.getElementById('sched-grid').innerHTML = '<div class="loading" style="grid-column:1/-1">Loading schedule...</div>';

    const liveEvent = await fetchLiveScore(cfg);
    const schedule = await fetchSchedule(cfg);
    
    allEvents = schedule;

    if (liveEvent) {
        renderLiveScore(liveEvent, cfg);
    } else {
        renderNextGame(schedule, cfg);
    }

    renderScheduleGrid(schedule, cfg);
}

/* ================================================================
   AUTO-REFRESH — keep live scores current without a reload
================================================================ */
setInterval(async () => {
    const cfg = sportConfig[currentSport];
    const liveEvent = await fetchLiveScore(cfg);
    if (liveEvent) {
        renderLiveScore(liveEvent, cfg);
    } else if (currentEvent === null || !currentEvent.competitions?.[0]?.status?.type?.completed) {
        // No live game right now — make sure we're showing the next-game card
        renderNextGame(allEvents, cfg);
    }
}, 30000);

/* Initialize */
(async () => {
    const cfg = sportConfig[currentSport];
    const liveEvent = await fetchLiveScore(cfg);
    const schedule = await fetchSchedule(cfg);
    
    allEvents = schedule;

    if (liveEvent) {
        renderLiveScore(liveEvent, cfg);
    } else {
        renderNextGame(schedule, cfg);
    }

    renderScheduleGrid(schedule, cfg);
})();
</script>
